server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Страница одна, маршруты внутри — через hash, поэтому всё ведём на index.html.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  # Код и библиотеки пока без версионирования в имени: держим недолго,
  # чтобы обновление доезжало до игроков само.
  location ~* \.(js|css)$ {
    add_header Cache-Control "public, max-age=300";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
